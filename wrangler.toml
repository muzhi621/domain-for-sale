# Cloudflare Pages 配置
# 说明：本系统用 Pages Functions（functions/ 目录）+ KV 存储。
# KV 绑定建议在 Cloudflare 控制台 → Pages 项目 → Settings → Functions → KV namespace bindings 中添加，
# 绑定变量名务必为 KV。也可在此处声明（需先创建 KV namespace: wrangler kv namespace create dfs_kv）。
name = "domain-for-sale"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# 如需在此声明 KV（取消注释并填入你的 namespace id）：
# [[kv_namespaces]]
# binding = "KV"
# id = "在此填入你的_KV_namespace_id"
